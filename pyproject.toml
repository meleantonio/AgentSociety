[project]
name = "emergent-constitution"
version = "0.1.0"
description = "Agent-based political economy simulation — 50+ citizen-agents self-organize governance from scratch"
authors = [
    { name = "meleantonio", email = "meleantonio@gmail.com" }
]
dependencies = [
    "pydantic>=2.0",
    "structlog>=24.0",
]
readme = "README.md"
requires-python = ">= 3.10"

[project.scripts]
emergent-constitution = "emergent_constitution.__main__:main"
emergent-constitution-v2 = "emergent_constitution.__main__:main_v2"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/emergent_constitution"]

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
